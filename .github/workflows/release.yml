name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG
        run: ./build_dmg.sh

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: ps3-rich-presence-macos
          path: |
            dist/PS3-Rich-Presence-macOS.dmg
            dist/PS3 Rich Presence.app

  cli:
    name: Package cross-platform CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CLI archive
        run: |
          mkdir -p release/PS3-Rich-Presence-CLI
          cp PS3RPD.py start.py README.md release/PS3-Rich-Presence-CLI/
          tar -czf release/PS3-Rich-Presence-CLI.tar.gz -C release PS3-Rich-Presence-CLI

      - name: Upload CLI asset
        uses: actions/upload-artifact@v4
        with:
          name: ps3-rich-presence-cli
          path: release/PS3-Rich-Presence-CLI.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [macos, cli]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: ps3-rich-presence-macos
          path: release/macos

      - name: Download CLI asset
        uses: actions/download-artifact@v4
        with:
          name: ps3-rich-presence-cli
          path: release/cli

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/macos/PS3-Rich-Presence-macOS.dmg
            release/cli/PS3-Rich-Presence-CLI.tar.gz
