name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG
        run: ./build_dmg.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ps3-rich-presence-macos
          path: dist/PS3-Rich-Presence-macOS.dmg

  packages:
    name: Build ${{ matrix.name }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: python -m pip install pyinstaller beautifulsoup4 networkscan pypresence requests "urllib3<2"

      - name: Build executable
        run: pyinstaller --clean --onefile --name PS3RPD PS3RPD.py

      - name: Archive Unix package
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          tar -czf "release/PS3RPD-${{ matrix.name }}.tar.gz" -C dist PS3RPD

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/PS3RPD.exe -DestinationPath "release/PS3RPD-${{ matrix.name }}.zip"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ps3rpd-package-${{ matrix.name }}
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [macos, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: ps3-rich-presence-macos
          path: release/macos

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: ps3rpd-package-*
          path: release/packages
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/macos/PS3-Rich-Presence-macOS.dmg
            release/packages/*
