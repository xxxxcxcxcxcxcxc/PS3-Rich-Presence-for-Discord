name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-15
    env:
      APPLE_SIGNING_CERT: ${{ secrets.APPLE_SIGNING_CERT }}
      APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY_NAME || '-' }}
      APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_ID_TEAM: ${{ secrets.APPLE_ID_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install DMG tooling
        run: brew install create-dmg

      - name: Import Apple signing certificate
        if: ${{ env.APPLE_SIGNING_CERT != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.APPLE_SIGNING_CERT }}
          p12-password: ${{ env.APPLE_SIGNING_CERT_PASSWORD }}

      - name: Build DMG
        run: ./build_dmg.sh

      - name: Notarize DMG
        if: ${{ env.APPLE_ID_EMAIL != '' && env.APPLE_ID_PASSWORD != '' && env.APPLE_ID_TEAM != '' }}
        run: |
          xcrun notarytool submit dist/PS3-Rich-Presence-macOS.dmg \
            --apple-id "$APPLE_ID_EMAIL" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_ID_TEAM" \
            --wait
          xcrun stapler staple dist/PS3-Rich-Presence-macOS.dmg
        env:
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_ID_TEAM: ${{ secrets.APPLE_ID_TEAM }}

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ps3-rich-presence-macos
          path: dist/PS3-Rich-Presence-macOS.dmg

  packages:
    name: Build ${{ matrix.name }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: python -m pip install pyinstaller beautifulsoup4 networkscan pypresence requests "urllib3<2"

      - name: Build executable
        run: pyinstaller --clean --onefile --name PS3RPD PS3RPD.py

      - name: Archive Unix package
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          tar -czf "release/PS3RPD-${{ matrix.name }}.tar.gz" -C dist PS3RPD

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/PS3RPD.exe -DestinationPath "release/PS3RPD-${{ matrix.name }}.zip"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ps3rpd-package-${{ matrix.name }}
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [macos, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: ps3-rich-presence-macos
          path: release/macos

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: ps3rpd-package-*
          path: release/packages
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/macos/PS3-Rich-Presence-macOS.dmg
            release/packages/*
